<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Stations d'essence</title>
</head>
<body>
  <h2>Stations en garde</h2>
  <div id="station-garde"></div>
  <button onclick="findNearestStation()">Trouver la station la plus proche</button>
  <script>
   async function loadStationEnGarde() {
  try {
    const response = await fetch("/api/stations/");
    const data = await response.json();
    const stations = data.stations;
    const stationEnGarde = stations.find(station => station.en_garde === true);
    if (stationEnGarde) {
      document.getElementById("station-garde").innerText =
        `Station en garde : ${stationEnGarde.nom}`;
    } else {
      document.getElementById("station-garde").innerText = "Aucune station en garde actuellement.";
    }
  } catch (err) {
    document.getElementById("station-garde").innerText =
      "Erreur lors de la récupération des stations : " + err;
  }
}
    async function findNearestStation() {
      try {
        const response = await fetch("/api/stations/");
        const data = await response.json();
        const stations = data.stations;
        navigator.geolocation.getCurrentPosition(position => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          let nearest = null;
          let minDistance = Infinity;
          stations.forEach(station => {
            const distance = getDistance(userLat, userLng, station.lat, station.lng);
            if (distance < minDistance) {
              minDistance = distance;
              nearest = station;
            }
          });
          if (nearest) {
            const url = `https://www.google.com/maps/dir/?api=1&origin=${userLat},${userLng}&destination=${nearest.lat},${nearest.lng}&travelmode=driving`;
            alert(`La station la plus proche est : ${nearest.nom}`);
            window.open(url, "_blank");
          }
        }, error => {
          alert("Impossible de récupérer votre position : " + error.message);
        });
      } catch (err) {
        alert("Erreur lors de la récupération des stations : " + err);
      }
    }
    function getDistance(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a =
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLng/2) * Math.sin(dLng/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }
    loadStationEnGarde();
  </script>
</body>
</html>
